<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEZOPAY | Payment Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../auth-custom.css">
    <style>
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .success-container {
            width: 100%;
            max-width: 450px;
            background: var(--surface-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            padding: 3rem 2rem;
            position: relative;
        }

        .success-icon-wrapper {
            width: 100px;
            height: 100px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-icon {
            font-size: 3rem;
            color: #10b981;
            animation: drawCheck 0.5s ease-out 0.3s forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes drawCheck {
            100% { opacity: 1; transform: scale(1); }
        }

        .success-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #10b981;
        }

        .success-amount {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .details-box {
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .detail-value {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2" style="background: rgba(16, 185, 129, 0.15);"></div>

    <div class="success-container slide-in-bottom">
        <div class="success-icon-wrapper">
            <i class="fas fa-check success-icon"></i>
        </div>

        <div class="success-title">Payment Successful!</div>
        <div style="color: var(--text-muted); margin-bottom: 1.5rem;">Your payment has been securely processed.</div>
        
        <div class="success-amount">₹1,500.00</div>

        <div class="details-box">
            <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-value" style="font-family: monospace;">ord_K92jSd82nd</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Transaction ID</span>
                <span class="detail-value" style="font-family: monospace;">txn_PL93nd84jB</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Method</span>
                <span class="detail-value">UPI</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Date & Time</span>
                <span class="detail-value" id="datetime"></span>
            </div>
        </div>

        <button onclick="window.location.href='dashboard.html'" class="btn btn-primary" style="width: 100%;">
            Return to Dashboard
        </button>
    </div>

    <script>
        document.getElementById('datetime').textContent = new Date().toLocaleString('en-US', { 
            month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    </script>
</body>
</html>
